apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-hub-api
  labels:
    app: experience-hub-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: experience-hub-api
  template:
    metadata:
      labels:
        app: experience-hub-api
    spec:
      containers:
        - name: core-api
          image: experience-hub:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/api"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-hub-worker
  labels:
    app: experience-hub-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: experience-hub-worker
  template:
    metadata:
      labels:
        app: experience-hub-worker
    spec:
      containers:
        - name: ticket-processor
          image: experience-hub:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: WORKER_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
